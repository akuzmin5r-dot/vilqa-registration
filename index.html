<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VILQA Registration</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            background: #F5F7F0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            background: #FFFFFF;
            border-radius: 32px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            margin: 0 auto 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 8px;
        }

        .logo-badge {
            font-size: 40px;
        }

        .logo h1 {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #2D3436 0%, #636E72 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        .logo p {
            color: #636E72;
            font-size: 15px;
            font-weight: 500;
        }

        .error-message {
            background: rgba(255, 107, 107, 0.1);
            border: 2px solid #FF6B6B;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            color: #FF6B6B;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .debug-info {
            background: #F8F9FA;
            border: 2px solid #E9ECEF;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 11px;
            color: #636E72;
            font-family: monospace;
            max-height: 150px;
            overflow-y: auto;
            display: none;
        }

        .debug-info.show {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #2D3436;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 16px;
            background: #F8F9FA;
            border: 2px solid #E9ECEF;
            border-radius: 16px;
            color: #2D3436;
            font-size: 16px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
        }

        input:focus,
        select:focus {
            outline: none;
            background: #FFFFFF;
            border-color: #DCFF64;
            box-shadow: 0 0 0 4px rgba(220, 255, 100, 0.2);
        }

        form.submitted input:invalid,
        form.submitted select:invalid {
            border-color: #FF6B6B;
            background: rgba(255, 107, 107, 0.05);
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='14' height='9' viewBox='0 0 14 9' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L7 7L13 1' stroke='%232D3436' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 16px center;
            padding-right: 40px;
        }

        .radio-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .radio-option input {
            display: none;
        }

        .radio-option label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: #F8F9FA;
            border: 2px solid #E9ECEF;
            border-radius: 16px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #636E72;
            position: relative;
            overflow: hidden;
        }

        .radio-option input:checked + label {
            border-color: #DCFF64;
            background: linear-gradient(135deg, #DCFF64 0%, #B4F064 100%);
            color: #2D3436;
        }

        .two-columns {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 12px !important;
        }

        .submit-button {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #2D3436 0%, #636E72 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 24px;
            box-shadow: 0 12px 32px rgba(45, 52, 54, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-button.ready {
            background: linear-gradient(135deg, #DCFF64 0%, #B4F064 100%);
            color: #2D3436;
            box-shadow: 0 12px 32px rgba(220, 255, 100, 0.4);
        }

        .submit-button:active {
            transform: scale(0.98);
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .submit-button.is-loading::before {
            content: "";
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: button-spin 0.7s linear infinite;
        }

        .submit-button.ready.is-loading::before {
            border: 2px solid rgba(45, 52, 54, 0.25);
            border-top-color: #2D3436;
        }

        @keyframes button-spin {
            to {
                transform: rotate(360deg);
            }
        }

        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(245, 247, 240, 0.95);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .success-overlay.show {
            display: flex;
        }

        .success-message {
            background: linear-gradient(135deg, #DCFF64 0%, #B4F064 100%);
            color: #2D3436;
            padding: 48px;
            border-radius: 32px;
            text-align: center;
        }

        .success-title {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .success-subtitle {
            font-size: 18px;
            font-weight: 500;
            color: #2D3436;
            opacity: 0.85;
        }

        @media (max-width: 400px) {
            .container {
                padding: 32px 20px;
            }
            
            .logo h1 {
                font-size: 36px;
            }
            
            input, select {
                font-size: 15px;
                padding: 14px;
            }
            
            label {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="success-overlay" id="overlay">
        <div class="success-message">
            <div class="success-title">Готово!</div>
            <div class="success-subtitle">Продолжим в чате!</div>
        </div>
    </div>

    <div class="container">
        <div class="logo">
            <div class="logo-header">
                <span class="logo-badge">🥗</span>
                <h1>VILQA</h1>
            </div>
            <p>Начни заботиться о себе</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="debug-info" id="debugInfo"></div>

        <form id="registrationForm">
            <div class="form-group">
                <label for="name">Имя</label>
                <input type="text" id="name" name="name" required placeholder="Введите имя">
            </div>

            <div class="two-columns">
                <div class="form-group">
                    <label>Пол</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="male" name="gender" value="male" required>
                            <label for="male">👨</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="female" name="gender" value="female" required>
                            <label for="female">👩</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="age">Возраст</label>
                    <input type="number" id="age" name="age" required placeholder="18" min="10" max="120">
                </div>
            </div>

            <div class="two-columns">
                <div class="form-group">
                    <label for="height">Рост, см</label>
                    <input type="number" id="height" name="height" required placeholder="170" min="100" max="250">
                </div>

                <div class="form-group">
                    <label for="weight">Вес, кг</label>
                    <input type="number" id="weight" name="weight" required placeholder="70" min="30" max="300" step="0.1">
                </div>
            </div>

            <div class="form-group">
                <label for="activity">Активность</label>
                <select id="activity" name="activity" required>
                    <option value="">Выберите уровень активности</option>
                    <option value="1.2">🪑 Сидячий</option>
                    <option value="1.375">🚶 Минимальная</option>
                    <option value="1.55">🏃 Умеренная</option>
                    <option value="1.725">💪 Высокая</option>
                    <option value="1.9">🏋️ Очень высокая</option>
                </select>
            </div>

            <div class="form-group">
                <label for="goal">Цель</label>
                <select id="goal" name="goal" required>
                    <option value="">Выберите вашу цель</option>
                    <option value="lose">⬇️ Похудеть</option>
                    <option value="lose_fast">⬇️⬇️ Быстро похудеть</option>
                    <option value="maintain">➡️ Держать вес</option>
                    <option value="gain">⬆️ Набрать массу</option>
                    <option value="gain_fast">⬆️⬆️ Быстро набрать</option>
                </select>
            </div>

            <!-- Скрытое поле для определения timezone -->
            <input type="hidden" id="timezone" name="timezone" value="">

            <button type="submit" class="submit-button" id="submitButton">
                Начать путь 🚀
            </button>
        </form>
    </div>

    <script>
        // Debug helper: в проде выключен по умолчанию, можно включить ?debug=1
        const DEBUG_MODE = new URLSearchParams(window.location.search).get('debug') === '1';

        function addDebug(msg) {
            if (!DEBUG_MODE) return;
            const debugDiv = document.getElementById('debugInfo');
            if (!debugDiv) {
                console.log('[Debug not ready]', msg);
                return;
            }
            const timestamp = new Date().toLocaleTimeString();
            debugDiv.textContent += `[${timestamp}] ${msg}\n`;
            debugDiv.classList.add('show');
            console.log(msg);
        }

        // Вся инициализация в DOMContentLoaded для предотвращения race conditions
        document.addEventListener('DOMContentLoaded', function() {
            addDebug('✅ DOM загружен, начинаем инициализацию');

            // Автоматическое определение timezone с fallback
            try {
                const userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                document.getElementById('timezone').value = userTimezone || 'UTC';
                addDebug('Timezone: ' + (userTimezone || 'UTC (fallback)'));
            } catch (e) {
                // Fallback для старых браузеров
                const offset = -new Date().getTimezoneOffset() / 60;
                document.getElementById('timezone').value = 'UTC';
                addDebug('Timezone: UTC' + offset + ' (fallback по offset)');
            }

            // Telegram WebApp initialization
            const tg = window.Telegram?.WebApp;
            const isTelegramWebApp = !!(tg && window.Telegram);
            let telegramData = {};

            if (isTelegramWebApp) {
                tg.ready();
                tg.expand();

                try {
                    tg.MainButton.hide();
                    tg.MainButton.isVisible = false;
                } catch(e) {
                    addDebug('MainButton error: ' + e.message);
                }
                addDebug('Telegram WebApp инициализирован');

                // Получаем данные пользователя из Telegram
                if (tg.initDataUnsafe?.user) {
                    const user = tg.initDataUnsafe.user;
                    telegramData = {
                        telegram_id: user.id,
                        telegram_username: user.username || '',
                        telegram_first_name: user.first_name || '',
                        telegram_last_name: user.last_name || '',
                        telegram_language: user.language_code || 'ru'
                    };

                    addDebug(`Telegram ID: ${user.id}`);

                    // Автозаполнение имени
                    if (user.first_name) {
                        document.getElementById('name').value = user.first_name;
                    }
                } else {
                    addDebug('⚠️ Telegram user данные недоступны');
                }
            } else {
                addDebug('⚠️ Не Telegram WebApp среда');
            }

            const form = document.getElementById('registrationForm');
            const submitButton = document.getElementById('submitButton');
            const errorMessage = document.getElementById('errorMessage');
            const submitDefaultText = 'Начать путь 🚀';

            let isSubmitting = false;

            function setSubmitLoading(isLoading) {
                isSubmitting = isLoading;
                submitButton.disabled = isLoading;
                submitButton.classList.toggle('is-loading', isLoading);
                submitButton.textContent = isLoading ? 'Отправка...' : submitDefaultText;
                submitButton.setAttribute('aria-busy', isLoading ? 'true' : 'false');
            }

            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.add('show');
                addDebug('❌ Ошибка: ' + message);
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 5000);
            }

            // Проверка заполненности всех полей
            function checkFormValidity() {
                const name = document.getElementById('name').value.trim();
                const gender = document.querySelector('input[name="gender"]:checked');
                const ageEl = document.getElementById('age');
                const heightEl = document.getElementById('height');
                const weightEl = document.getElementById('weight');
                const activity = document.getElementById('activity').value;
                const goal = document.getElementById('goal').value;

                const age = ageEl.value;
                const height = heightEl.value;
                const weight = weightEl.value;
                const isTelegramContextValid = isTelegramWebApp && !!telegramData.telegram_id;
                const isValid =
                    !!name &&
                    !!gender &&
                    !!age &&
                    !!height &&
                    !!weight &&
                    !!activity &&
                    !!goal &&
                    ageEl.checkValidity() &&
                    heightEl.checkValidity() &&
                    weightEl.checkValidity() &&
                    isTelegramContextValid;

                if (isValid) {
                    submitButton.classList.add('ready');
                } else {
                    submitButton.classList.remove('ready');
                }
            }

            // Вызываем проверку после автозаполнения
            checkFormValidity();

            // Слушаем изменения во всех полях
            document.getElementById('name').addEventListener('input', checkFormValidity);
            document.getElementById('age').addEventListener('input', checkFormValidity);
            document.getElementById('height').addEventListener('input', checkFormValidity);
            document.getElementById('weight').addEventListener('input', checkFormValidity);
            document.getElementById('activity').addEventListener('change', checkFormValidity);
            document.getElementById('goal').addEventListener('change', checkFormValidity);
            document.querySelectorAll('input[name="gender"]').forEach(radio => {
                radio.addEventListener('change', checkFormValidity);
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (isSubmitting) return;
                form.classList.add('submitted');

                // Улучшенная валидация с конкретными сообщениями
                if (!form.checkValidity()) {
                    // Находим первое невалидное поле и показываем конкретную ошибку
                    const name = document.getElementById('name').value.trim();
                    const gender = document.querySelector('input[name="gender"]:checked');
                    const age = document.getElementById('age').value;
                    const height = document.getElementById('height').value;
                    const weight = document.getElementById('weight').value;
                    const activity = document.getElementById('activity').value;
                    const goal = document.getElementById('goal').value;

                    if (!name) {
                        showError('❗ Укажите ваше имя');
                    } else if (!gender) {
                        showError('❗ Выберите пол');
                    } else if (!age) {
                        showError('❗ Укажите возраст');
                    } else if (!height) {
                        showError('❗ Укажите рост');
                    } else if (!weight) {
                        showError('❗ Укажите вес');
                    } else if (!activity) {
                        showError('❗ Выберите уровень активности');
                    } else if (!goal) {
                        showError('❗ Выберите вашу цель');
                    } else {
                        showError('❗ Заполните все поля корректно');
                    }
                    return;
                }

                if (!isTelegramWebApp || !telegramData.telegram_id) {
                    showError('❌ Форму можно отправить только из Telegram');
                    return;
                }

                setSubmitLoading(true);
                addDebug('Начинаем отправку формы...');

                const formData = new FormData(form);
                const data = Object.fromEntries(formData);
                Object.assign(data, telegramData);
                data.initData = tg.initData || '';
                data.name = String(data.name || '').trim();

                // Проверка наличия gender перед отправкой
                if (!data.gender || (data.gender !== 'male' && data.gender !== 'female')) {
                    showError('❗ Пожалуйста, выберите пол');
                    setSubmitLoading(false);
                    return;
                }

                data.registrationDate = new Date().toISOString();
                addDebug(`Отправка данных: name=${data.name}, gender=${data.gender}, age=${data.age}`);

                const webhookUrl = 'https://n8n.svoidigital.ru/webhook/vilqa-registration';
                addDebug(`Отправка на: ${webhookUrl}`);
                addDebug('Данные подготовлены к отправке');

                function finishSuccess() {
                    document.getElementById('overlay').classList.add('show');
                    setTimeout(() => {
                        if (isTelegramWebApp && tg) {
                            tg.close();
                        } else {
                            location.reload();
                        }
                    }, 300);
                }

                try {
                    addDebug('Проверка доступности вебхука...');

                    const response = await fetch(webhookUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(data)
                    }).catch(err => {
                        addDebug('Fetch failed: ' + err.message);
                        throw new Error('Не удалось связаться с сервером. Возможные причины:\n1. Workflow не активен\n2. Проблема с CORS\n3. Неправильный URL');
                    });

                    addDebug(`Response status: ${response.status} ${response.statusText}`);
                    let result;
                    try {
                        result = await response.json();
                    } catch {
                        throw new Error('Не удалось получить подтверждение регистрации. Попробуйте ещё раз.');
                    }
                    if (!response.ok || result?.success !== true) {
                        throw new Error(result?.message || 'Регистрация не сохранена. Попробуйте ещё раз.');
                    }

                    finishSuccess();
                } catch (error) {
                    addDebug(`❌ Fetch error: ${error.message}`);
                    console.error('Полная ошибка:', error);
                    showError('❌ Ошибка отправки: ' + error.message);
                    setSubmitLoading(false);
                }
            });

            addDebug('✅ Инициализация завершена');
        });
    </script>
</body>
</html>
